<style>
/* Composición: una columna estrecha para el móvil; cabecera con la marca de la empresa, blanco y rojo; barra de progreso fija arriba. */
:root {

  --accent: #ff6a6f; --accent-fg: #2a0507; --accent-soft: #3a1b1d; --bad: #ff9a9d; --good: #7fd49a;

* { box-sizing: border-box; }

.wrap { max-width: 640px; margin: 0 auto; padding-block: 0 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }

.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

.blocks { display: grid; gap: 8px; margin-top: 4px; grid-template-columns: repeat(3, minmax(0, 1fr)); }

input[type=text], input[type=tel], input[type=email], input[type=date], input[type=number], select, textarea {

.consent.err { border-color: var(--bad); }
.send { margin-top: 28px; display: grid; gap: 10px; }

.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.sm { min-height: 40px; font-size: 15px; padding: 0 14px; }

@media (prefers-reduced-motion: reduce) { .prog i { transition: none; } }

<div class="wrap">

</div>

function oLab(o) { return o[lang]; }
function el(tag, props, kids) { var e = document.createElement(tag); Object.keys(props || {}).forEach(function (k) { if (k === 'text') e.textContent = props[k]; else if (k === 'cls') e.className = props[k]; else e.setAttribute(k, props[k]); }); (kids || []).forEach(function (c) { e.appendChild(c); }); return e; }

// ---------- construcción ----------
var fieldEls = {};
function build() {
  var c = cfgNow(), form = $('form'); form.textContent = ''; fieldEls = {};
  SECTIONS.forEach(function (s) {
    var sec = el('section', { cls: 'sec' }); sec.appendChild(el('h2', { text: s[lang] }));
    s.fields.forEach(function (f) {
      var w = el('div', { cls: 'fld', id: 'w-' + f.id }), id = 'f-' + f.id, l = lab(f);
      var head = f.t === 'radio' || f.t === 'check' ? el('div', { cls: 'lg', id: id + '-l' }) : el('label', { 'for': id });
      head.appendChild(document.createTextNode(l)); if (f.opt) head.appendChild(el('span', { cls: 'opt', text: ' ' + T('optTag') }));
      w.appendChild(head);
      if (f.hint) w.appendChild(el('p', { cls: 'hint', id: id + '-h', text: f.hint[lang] }));
      if (f.t === 'radio' || f.t === 'check') {
        var box = el('div', { cls: 'choices', role: f.t === 'radio' ? 'radiogroup' : 'group', 'aria-labelledby': id + '-l' });
        f.o.forEach(function (o, i) {
          var inp = el('input', { type: f.t === 'radio' ? 'radio' : 'checkbox', name: id, id: id + '-' + i, value: o.v });
          if (f.t === 'radio') inp.checked = V[f.id] === o.v; else inp.checked = (V[f.id] || []).indexOf(o.v) >= 0;
          inp.addEventListener('change', function () {
            if (f.t === 'radio') V[f.id] = o.v; else { var a = V[f.id] || []; a = a.filter(function (x) { return x !== o.v; }); if (inp.checked) a.push(o.v); V[f.id] = a; }
            update();
          });
          box.appendChild(el('label', {}, [inp, el('span', { text: oLab(o) })]));
        });
        w.appendChild(box);
      } else {
        var inp2;
        if (f.t === 'textarea') inp2 = el('textarea', { id: id, rows: '3' });
        else if (f.t === 'select') {
          inp2 = el('select', { id: id }); inp2.appendChild(el('option', { value: '', text: T('choose') }));
          f.o.forEach(function (o) { inp2.appendChild(el('option', { value: o.v, text: oLab(o) })); });
        } else {
          inp2 = el('input', { id: id, type: f.t === 'number' ? 'number' : f.t });
          if (f.t === 'number') { inp2.setAttribute('inputmode', 'decimal'); inp2.setAttribute('min', '0'); inp2.setAttribute('step', 'any'); }
          if (f.t === 'tel') inp2.setAttribute('inputmode', 'tel'); if (f.ac) inp2.setAttribute('autocomplete', f.ac);
        }
        if (V[f.id] !== undefined) inp2.value = V[f.id];
        inp2.addEventListener('input', function () { V[f.id] = inp2.value; update(); });
        inp2.addEventListener('change', function () { V[f.id] = inp2.value; update(); });
        w.appendChild(inp2);
      }
      w.appendChild(el('p', { cls: 'msg-err', id: id + '-e', hidden: '' }));
      sec.appendChild(w); fieldEls[f.id] = w;
    });
    form.appendChild(sec);
  });
  // consentimiento y envío
  var cs = el('label', { cls: 'consent', id: 'consentBox' }), cb = el('input', { type: 'checkbox', id: 'consent' });
  cb.checked = consent; cb.addEventListener('change', function () { consent = cb.checked; update(); });
  cs.appendChild(cb); cs.appendChild(el('span', { text: UI[lang].consent(c) })); form.appendChild(el('div', { cls: 'sec' }, [cs, el('p', { cls: 'msg-err', id: 'consent-e', hidden: '', text: T('consentErr') })]));
  var sd = $('send'); sd.textContent = '';
  sd.appendChild(el('h2', { text: T('sendH') })); sd.appendChild(el('p', { cls: 'hint', text: UI[lang].sendNote(c) }));
  var wa = el('a', { cls: 'btn primary', id: 'bWa', href: '#', target: '_blank', rel: 'noopener', text: T('wa') });
  var ml = el('a', { cls: 'btn', id: 'bMail', href: '#', text: T('mail') });
  var cp = el('button', { cls: 'btn', type: 'button', id: 'bCopy', text: T('copy') });
  sd.appendChild(wa); sd.appendChild(ml); sd.appendChild(cp);
  sd.appendChild(el('p', { cls: 'status', id: 'status', role: 'status', 'aria-live': 'polite' }));
  var det = el('details', { cls: 'sum' }); det.appendChild(el('summary', { text: T('sumH') })); det.appendChild(el('pre', { id: 'sumPre' })); sd.appendChild(det);
  wa.addEventListener('click', function (e) { if (!guard(e)) return; setStatus(T('opened'), 'ok'); });
  ml.addEventListener('click', function (e) { if (!guard(e)) return; setStatus(T('opened'), 'ok'); });
  cp.addEventListener('click', function () { if (!guard()) return; copyText(summary()); });
  // cabecera / saludo
  $('brand').textContent = UI[lang].brand(c);
  var hero = $('hero'); hero.textContent = '';
  hero.appendChild(el('h1', { text: UI[lang].title })); hero.appendChild(el('p', { text: UI[lang].hi(c) + ' ' + UI[lang].intro(c) }));
  var bl = el('div', { cls: 'blocks' });
  [UI[lang].cont, UI[lang].cont2, UI[lang].cont3].forEach(function (b) { bl.appendChild(el('div', {}, [el('b', { text: b[0] }), document.createTextNode(b[1])])); });
  hero.appendChild(bl);
  $('foot').textContent = UI[lang].foot(c); $('cname').textContent = COMPANY; $('legal').textContent = COMPANY;
  if (LOGO) { $('logo').src = LOGO; $('logo').hidden = false; }
  $('lES').setAttribute('aria-pressed', String(lang === 'es')); $('lEN').setAttribute('aria-pressed', String(lang === 'en'));
  document.documentElement.lang = lang;
  update();
}

// ---------- lógica ----------
function visible(f) { return !f.showIf || f.showIf(V); }
function filled(f) { var v = V[f.id]; return Array.isArray(v) ? v.length > 0 : (v !== undefined && String(v).trim() !== ''); }
function validField(f) {
  if (!filled(f)) return false;
  var v = String(V[f.id]).trim();
  if (f.t === 'email') return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  if (f.t === 'tel') return v.replace(/\D/g, '').length >= 9;
  return true;
}
function required() { var r = []; SECTIONS.forEach(function (s) { s.fields.forEach(function (f) { if (f.req && visible(f)) r.push(f); }); }); return r; }
function update() {
  SECTIONS.forEach(function (s) { s.fields.forEach(function (f) { var w = fieldEls[f.id]; if (w) w.hidden = !visible(f); var l = w && w.querySelector('label[for], .lg'); if (l && f.t !== 'radio' && f.t !== 'check') { /* etiqueta dinámica */ var t = lab(f); if (l.firstChild && l.firstChild.nodeValue !== t) l.firstChild.nodeValue = t; } if (l && (f.t === 'radio' || f.t === 'check')) { var t2 = lab(f); if (l.firstChild && l.firstChild.nodeValue !== t2) l.firstChild.nodeValue = t2; } }); });
  var rq = required(), ok = rq.filter(validField).length + (consent ? 1 : 0), tot = rq.length + 1;
  $('progBar').style.width = Math.round(ok / tot * 100) + '%'; $('progTxt').textContent = T('prog')(ok, tot);
  if (tried) markErrors();
  var s = summary(); var pre = $('sumPre'); if (pre) pre.textContent = s;
  var c = cfgNow();
  var phone = (c.p || '').replace(/\D/g, ''); if (phone.indexOf('00') === 0) phone = phone.slice(2); if (phone.length === 9) phone = '34' + phone;
  var wa = $('bWa'); if (wa) wa.href = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(s);
  var ml = $('bMail'); if (ml) ml.href = 'mailto:' + (c.e || '') + '?subject=' + encodeURIComponent('Cuestionario seguro de comercio' + (V.hName ? ' - ' + V.hName : '')) + '&body=' + encodeURIComponent(s);
  save();
}
function markErrors() {
  var first = null;
  SECTIONS.forEach(function (sc) { sc.fields.forEach(function (f) {
    var w = fieldEls[f.id]; if (!w) return;
    var bad = !!(f.req && visible(f) && !validField(f)); w.classList.toggle('err', bad);
    var e = $('f-' + f.id + '-e'); if (e) { e.hidden = !bad; e.textContent = bad ? T('req') : ''; }
    if (bad && !first) first = w;
  }); });
  var cb = $('consentBox'), ce = $('consent-e'); if (cb) { cb.classList.toggle('err', !consent); ce.hidden = consent; if (!consent && !first) first = cb; }
  return first;
}
function guard(e) {
  tried = true; var first = markErrors();
  if (first) { if (e && e.preventDefault) e.preventDefault(); var n = required().filter(function (f) { return !validField(f); }).length + (consent ? 0 : 1); setStatus(T('missing')(n), 'bad'); first.scrollIntoView({ behavior: 'smooth', block: 'center' }); return false; }
  return true;
}
function setStatus(t, cls) { var s = $('status'); s.textContent = t; s.className = 'status ' + (cls || ''); }
function copyText(t) {
  var done = function () { setStatus(T('copied'), 'ok'); }, fail = function () { setStatus(T('copyFail'), 'bad'); $('sumPre').parentNode.open = true; };
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(done, fail); return; } } catch (e) {}
  fail();
}

// ---------- resumen (siempre en español, para quien lo recibe) ----------
function esVal(f, v) {
  if (f.o) { var map = function (x) { var o = f.o.filter(function (q) { return q.v === x; })[0]; return o ? o.es : x; }; return Array.isArray(v) ? v.map(map).join(', ') : map(v); }
  if (f.t === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return v.split('-').reverse().join('/');
  return String(v).trim();
}
function summary() {
  var c = cfgNow(), L = [];
  L.push('CUESTIONARIO SEGURO DE COMERCIO' + (V.hName ? ' - ' + V.hName : ''));
  L.push('Idioma del cliente: ' + (lang === 'en' ? 'inglés' : 'español') + (c.n ? ' | Preparado para: ' + c.n : ''));
  SECTIONS.forEach(function (s) {
    var lines = [];
    s.fields.forEach(function (f) {
      if (!visible(f) || !filled(f)) return;
      var lbl = typeof f.es === 'function' ? f.es(V) : f.es, v = esVal(f, V[f.id]);
      lines.push('- ' + lbl + ': ' + v);
    });
    if (lines.length) { L.push(''); L.push(s.es.toUpperCase()); lines.forEach(function (x) { L.push(x); }); }
  });
  L.push(''); L.push('Protección de datos: ' + (consent ? 'aceptada por el cliente' : 'pendiente'));
  return L.join('\n');
}

// ---------- panel del agente ----------
function b64(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
function agentCfg() {
  var p = $('aPhone').value.trim(), m = $('aMail').value.trim(), s = $('aSender').value.trim();
  if (!s || !p || !m) { $('aOut').textContent = 'Faltan el remitente, el móvil o el correo.'; return null; }
  return { n: $('aName').value.trim(), tr: $('aTrato').value, l: $('aLang').value, s: s, p: p, e: m };
}
function setupAgent() {
  $('agent').hidden = false;
  $('agentHint').textContent = 'Rellena los datos de quien recibirá las respuestas y genera el enlace. Para que el enlace funcione, esta página debe estar publicada en una web (por ejemplo GitHub Pages). Si no, usa «Descargar para el cliente» y envía el archivo por WhatsApp.';
  $('aLink').onclick = function () {
    var c = agentCfg(); if (!c) return;
    var base = location.href.split('#')[0], url = base + '#c=' + encodeURIComponent(b64(c));
    $('aOut').textContent = ''; $('aOut').appendChild(document.createTextNode('Enlace: ')); $('aOut').appendChild(el('code', { text: url }));
    if (/^file:/.test(base)) $('aOut').appendChild(document.createTextNode(' (Aviso: esta página está abierta desde un archivo; el enlace solo servirá cuando la publiques en una web.)'));
    $('aLink').dataset.url = url;
  };
  $('aCopy').onclick = function () {
    if (!$('aLink').dataset.url) $('aLink').onclick(); var u = $('aLink').dataset.url; if (!u) return;
    try { navigator.clipboard.writeText(u).then(function () { $('aOut').textContent = 'Enlace copiado.'; }, function () { $('aOut').textContent = 'No se pudo copiar; selecciónalo arriba.'; }); } catch (e) { $('aOut').textContent = 'No se pudo copiar; selecciónalo arriba.'; }
  };
  $('aDown').onclick = function () {
    var c = agentCfg(); if (!c) return;
    try {
      var html = SRC.replace('<head>', '<head>\n<script>window.__CFG=' + JSON.stringify(c).replace(/</g, '\\u003c') + ';<\/script>');
      var blob = new Blob([html], { type: 'text/html' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'cuestionario_comercio' + (c.n ? '_' + c.n.replace(/[^\w\-]+/g, '_') : '') + '.html'; document.body.appendChild(a); a.click(); a.remove();
      $('aOut').textContent = 'Archivo generado. Envíalo al cliente por WhatsApp (en iPhone, que lo abra con Safari).';
    } catch (e) { $('aOut').textContent = 'Aquí no se pueden descargar archivos. Abre la página desde un navegador normal.'; }
  };
  $('aPrev').onclick = function () {
    var c = agentCfg(); if (!c) return; CFG = c; preview = true; lang = c.l; V = {}; consent = false; tried = false;
    $('agent').hidden = true; $('prevBar').hidden = false; $('prevTxt').textContent = UI[lang].prevTxt; $('prevExit').textContent = UI[lang].prevExit; build(); window.scrollTo(0, 0);
  };
  $('prevExit').onclick = function () { CFG = null; preview = false; $('prevBar').hidden = true; $('agent').hidden = false; V = {}; consent = false; tried = false; build(); window.scrollTo(0, 0); };
}

// ---------- arranque ----------
CFG = loadCfg();
if (CFG) { lang = CFG.l === 'en' ? 'en' : 'es'; restore(); }
else { setupAgent(); }
$('lES').onclick = function () { lang = 'es'; if (preview) { $('prevTxt').textContent = UI.es.prevTxt; $('prevExit').textContent = UI.es.prevExit; } build(); };
$('lEN').onclick = function () { lang = 'en'; if (preview) { $('prevTxt').textContent = UI.en.prevTxt; $('prevExit').textContent = UI.en.prevExit; } build(); };
['aName', 'aTrato', 'aSender'].forEach(function (i) { $(i).addEventListener('input', function () { if (!CFG) build(); }); });
build();
})();
</script>
